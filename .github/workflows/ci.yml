name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Signing is disabled everywhere: CI has no certificate and nothing is distributed.
env:
  NO_SIGNING: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGN_IDENTITY=

jobs:
  validate-levels:
    name: Validate level data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run level validator
        run: python3 tools/validate_levels.py --verbose

  build-macos:
    name: Build and test macOS app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        # MetalRenderer uses the Metal 4 API from the macOS 26 SDK, so the
        # build needs Xcode 26 or newer. Pick the newest non-beta Xcode on the runner.
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i macosx

      - name: Unit tests (Debug)
        # The shared "fpsgame1" scheme builds the app and runs fpsgame1Tests,
        # which cover the Foundation-only engine (world, navigation, player,
        # weapons, enemies, level flow).
        run: |
          set -o pipefail
          xcodebuild \
            -project fpsgame1.xcodeproj \
            -scheme fpsgame1 \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet \
            $NO_SIGNING \
            test

      - name: Build (Release, unsigned)
        # The Debug build above is -Onone; make sure the optimised build that
        # people actually play also compiles (whole-module optimisation can
        # surface errors and warnings the Debug build does not).
        run: |
          set -o pipefail
          xcodebuild \
            -project fpsgame1.xcodeproj \
            -scheme fpsgame1 \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -quiet \
            $NO_SIGNING \
            build
